<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 도구함</title>
<meta name="description" content="자잘한 개인 도구 모음">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a18" media="(prefers-color-scheme: dark)">
<script src="hub.js" defer></script>
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1b2320; --muted:#66706b; --line:#e2dfd6;
  --brand:#1f3b33; --accent:#e8a838; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(27,35,32,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141a18; --card:#1d2522; --ink:#e8ede9; --muted:#96a39c; --line:#2c3632;
         --brand:#7fc4ae; --shadow:0 1px 2px rgba(0,0,0,.3); }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px; margin:0 auto}
header{display:flex; align-items:center; gap:12px; margin:4px 0 20px}
header img{width:40px; height:40px; border-radius:10px}
h1{font-size:22px; margin:0; letter-spacing:-.01em}
header p{margin:0; color:var(--muted); font-size:13px}
header .sp{flex:1}
#installBtn{border:0; border-radius:999px; background:var(--brand); color:var(--bg);
  font:inherit; font-size:13px; font-weight:700; padding:8px 14px; cursor:pointer}
#installBtn[hidden]{display:none}

.grid{display:grid; grid-template-columns:1fr; gap:10px}
.tool{display:flex; align-items:center; gap:14px; padding:14px; min-height:76px;
  background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
  color:inherit; text-decoration:none; -webkit-tap-highlight-color:transparent}
.tool:active{transform:scale(.985)}
.tool:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.tool .ic{flex:none; width:46px; height:46px; border-radius:12px; display:grid; place-items:center;
  font-size:24px; background:var(--tint)}
@media (prefers-color-scheme: dark){ .tool .ic{background:color-mix(in srgb, var(--tint) 18%, var(--card))} }
.tool b{display:block; font-size:16px}
.tool span.d{display:block; color:var(--muted); font-size:13px; line-height:1.4; margin-top:1px}
.tool .ar{margin-left:auto; color:var(--muted); flex:none}

footer{margin-top:22px; color:var(--muted); font-size:12px; text-align:center}
#net{display:inline-block; margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icons/icon-192.png" alt="">
    <div>
      <h1>내 도구함</h1>
      <p>자잘한 개인 도구 모음</p>
    </div>
    <span class="sp"></span>
    <button id="installBtn" hidden>앱 설치</button>
  </header>

  <nav class="grid" id="list" aria-label="도구 목록"></nav>

  <footer>
    <span id="count"></span><span id="net"></span>
  </footer>
</div>

<script>
/* ============================================================
 * 새 도구 추가: 폴더를 하나 만들고 여기에 한 줄 추가하면 끝.
 *   href  : 폴더 이름 + '/'
 *   icon  : 이모지 하나
 *   tint  : 아이콘 배경색
 * ============================================================ */
const TOOLS = [
  { href:'golf/',   icon:'⛳', name:'골프 뽑기',             desc:'4인 팀 뽑기, 배판, 홀별 적립 정산',         tint:'#e0efe4' },
  { href:'idle/',   icon:'⚔️', name:'아이들슬레이어 도구상자', desc:'병기고 · 몬스터 · 오프라인 수입 · 측정 기록', tint:'#e7e3f6' },
  { href:'zephyr/', icon:'🗺️', name:'서풍의 광시곡 아이템 지도', desc:'놓치면 못 얻는 아이템 위치·시기, 체크리스트',     tint:'#f4ead6' },
  { href:'pal/',    icon:'🐑', name:'펠 도감',               desc:'팰월드 펠 287종 · 속성 · 작업 적성 · 포획 체크', tint:'#e3ecfb' },
  { href:'oni/',    icon:'🫧', name:'산소 미포함 방 가이드',  desc:'방 종류별 조건·보너스, 내 구역이 무슨 방인지 판정', tint:'#dff1f0' },
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('list').innerHTML = TOOLS.map(t => `
  <a class="tool" href="${esc(t.href)}" style="--tint:${esc(t.tint||'#eee')}">
    <span class="ic" aria-hidden="true">${esc(t.icon)}</span>
    <span><b>${esc(t.name)}</b><span class="d">${esc(t.desc||'')}</span></span>
    <svg class="ar" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </a>`).join('');
document.getElementById('count').textContent = `도구 ${TOOLS.length}개`;

/* 온라인일 때 도구 페이지를 미리 받아둬서, 한 번도 안 연 도구도 오프라인에서 열리게 */
function warm(){
  if (!navigator.onLine) return;
  TOOLS.forEach(t => fetch(t.href, { headers:{ accept:'text/html' } }).catch(()=>{}));
}
if ('serviceWorker' in navigator) navigator.serviceWorker.ready.then(warm);

/* 오프라인 표시 */
function net(){ document.getElementById('net').textContent = navigator.onLine ? '' : '· 오프라인'; }
addEventListener('online', net); addEventListener('offline', net); net();

/* 크롬 안드로이드: 설치 버튼 */
let deferred = null;
addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e;
  document.getElementById('installBtn').hidden = false;
});
document.getElementById('installBtn').onclick = async () => {
  if (!deferred) return;
  deferred.prompt(); await deferred.userChoice; deferred = null;
  document.getElementById('installBtn').hidden = true;
};
addEventListener('appinstalled', () => { document.getElementById('installBtn').hidden = true; });
</script>
</body>
</html>
