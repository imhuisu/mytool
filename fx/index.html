<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>환율 계산기</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/favicon.png">
<script src="../hub.js" defer></script>
<style>
:root{ --bg:#f4f6f3; --card:#fff; --ink:#1b2320; --muted:#66706b; --line:#dfe5dd; --brand:#c8102e; --brand2:#1f7a4d; --soft:#fbe9ec; --gold:#b8860b; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121614; --card:#1b211e; --ink:#e8ede9; --muted:#97a39c; --line:#2b3430; --brand:#ff5a6e; --brand2:#4cc38a; --soft:#3a1d22; --gold:#e0b84e; }
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 32px}
.wrap{max-width:520px; margin:0 auto}
header{display:flex; align-items:center; gap:8px; margin:2px 0 12px}
h1{font-size:21px; margin:0; flex:1}
select{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:7px 8px; font:inherit; font-weight:700}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px}
.lab{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:4px}
.big{display:flex; align-items:baseline; gap:6px}
.big input{flex:1; min-width:0; border:0; background:none; color:var(--ink); font:inherit; font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; padding:0; outline:none}
.big .u{font-size:18px; font-weight:800; color:var(--muted)}
.out{font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; word-break:break-all}
.out.from{color:var(--brand)} .out.to{color:var(--brand2)}
.swap{display:block; margin:-4px auto 6px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:6px 16px; font:inherit; font-weight:700; cursor:pointer}
.keys{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px}
.keys button{border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px; padding:13px 0; font:inherit; font-size:21px; font-weight:700; cursor:pointer; font-variant-numeric:tabular-nums}
.keys button.k{font-size:16px; color:var(--brand)}
.keys button:active{transform:translateY(1px)}
.quick{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.quick button{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:6px 11px; font:inherit; font-size:13px; font-weight:700; cursor:pointer}
.rate{font-size:13.5px; color:var(--muted)}
.rate b{color:var(--ink)}
.rate .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px}
.rate input{width:110px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:9px; padding:6px 8px; font:inherit; font-weight:700}
.rate button{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:9px; padding:6px 10px; font:inherit; font-size:13px; font-weight:700; cursor:pointer}
.tip{margin-top:8px; padding:8px 10px; border-radius:10px; background:var(--soft); color:var(--ink); font-size:13.5px}
table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:14.5px}
td{padding:7px 4px; border-bottom:1px solid var(--line)} td:last-child{text-align:right; font-weight:700}
.warn{color:var(--gold); font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<header><h1>환율 계산기</h1>
  <select id="cur" aria-label="통화">
    <option value="VND">🇻🇳 베트남 동</option><option value="USD">🇺🇸 달러</option><option value="JPY">🇯🇵 엔</option>
    <option value="THB">🇹🇭 바트</option><option value="EUR">🇪🇺 유로</option><option value="CNY">🇨🇳 위안</option><option value="PHP">🇵🇭 페소</option>
  </select>
</header>

<div class="card">
  <div class="lab"><span id="fromLab"></span><span id="clearHint">⌫ 길게 누르면 지우기</span></div>
  <div class="big"><input id="amt" inputmode="decimal" autocomplete="off" aria-label="금액"><span class="u" id="fromU"></span></div>
  <button class="swap" id="swap">⇅ 방향 바꾸기</button>
  <div class="lab"><span id="toLab"></span></div>
  <div class="out to" id="out">0</div>
  <div class="quick" id="quick"></div>
  <div class="keys" id="keys">
    <button>7</button><button>8</button><button>9</button>
    <button>4</button><button>5</button><button>6</button>
    <button>1</button><button>2</button><button>3</button>
    <button class="k" data-k="000">000</button><button>0</button><button class="k" data-k="bs" aria-label="한 글자 지우기">⌫</button>
  </div>
</div>

<div class="card rate">
  <div id="rateLine"></div>
  <div class="tip" id="tip" hidden></div>
  <div class="row">
    <button id="refresh">↻ 환율 새로 받기</button>
    <span>직접:</span><input id="manual" inputmode="decimal" aria-label="직접 환율"><span id="manualU"></span>
  </div>
</div>

<div class="card">
  <div class="lab"><span id="tblLab">자주 쓰는 금액</span></div>
  <table id="tbl"></table>
</div>
<div class="rate" style="text-align:center">환율은 참고용 (은행·환전소 실제 환율과 다를 수 있어요). 마지막으로 받은 환율이 저장돼 인터넷 없이도 계산돼요.</div>
</div>
<script>
const $=id=>document.getElementById(id);
const KEY='fx-v1';
/* 1원당 외화. 기본값은 대략치 (2025년 기준) — 처음 열 때 인터넷에서 새로 받음 */
const FALLBACK={VND:18.6, USD:0.00072, JPY:0.107, THB:0.024, EUR:0.00064, CNY:0.0052, PHP:0.041};
const NAME={VND:'동',USD:'달러',JPY:'엔',THB:'바트',EUR:'유로',CNY:'위안',PHP:'페소'};
const QUICK={VND:[10000,20000,50000,100000,200000,500000], USD:[1,5,10,20,50,100], JPY:[100,500,1000,5000,10000], THB:[20,50,100,500,1000], EUR:[1,5,10,20,50,100], CNY:[1,10,50,100,500], PHP:[20,50,100,500,1000]};
let st={cur:'VND', dir:'f2k', amt:'', rates:null, at:0, src:'', manual:{}};
try{ Object.assign(st, JSON.parse(localStorage.getItem(KEY))||{}); }catch(e){}
let fresh=false;
const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} };

const rate=()=>{ const m=st.manual[st.cur]; if(m>0) return m; return (st.rates&&st.rates[st.cur])||FALLBACK[st.cur]; };  // 1원 = rate 외화
const fmt=(n,cur)=>{
  if(!isFinite(n)) return '0';
  const d = cur==='KRW'||cur==='VND'||cur==='JPY' ? 0 : 2;
  return n.toLocaleString('ko-KR',{maximumFractionDigits:d, minimumFractionDigits:0});
};
const num=s=>parseFloat(String(s).replace(/[^\d.]/g,''))||0;

function render(){
  const f2k=st.dir==='f2k', c=st.cur, r=rate();
  $('cur').value=c;
  $('fromLab').textContent = f2k ? NAME[c]+' ('+c+')' : '원 (KRW)';
  $('toLab').textContent = f2k ? '원 (KRW)' : NAME[c]+' ('+c+')';
  $('fromU').textContent = f2k ? NAME[c] : '원';
  const a=num(st.amt);
  $('amt').value = st.amt==='' ? '' : (st.amt.endsWith('.')? st.amt : fmt(a, f2k?c:'KRW'));
  $('amt').placeholder='0';
  const res = f2k ? a/r : a*r;
  $('out').textContent = fmt(res, f2k?'KRW':c)+' '+(f2k?'원':NAME[c]);
  $('quick').innerHTML=(f2k?QUICK[c]:[1000,5000,10000,50000,100000]).map(v=>'<button data-q="'+v+'">'+fmt(v,f2k?c:'KRW')+'</button>').join('');
  // 환율 줄
  const unit = c==='VND'? 1000 : c==='JPY'? 100 : 1;
  const when = st.manual[c]>0 ? '<span class="warn">직접 입력한 환율</span>'
    : st.at ? '기준 '+new Date(st.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+' ('+st.src+')'
    : '<span class="warn">대략 기본값 · 인터넷 연결 후 새로 받기</span>';
  $('rateLine').innerHTML='<b>'+fmt(unit,c)+' '+NAME[c]+' = '+fmt(unit/r,'KRW')+'원</b> · 10,000원 = <b>'+fmt(10000*r,c)+' '+NAME[c]+'</b><br>'+when;
  $('manualU').textContent=NAME[c]+' / 1원';
  $('manual').value = st.manual[c]>0 ? st.manual[c] : '';
  $('manual').placeholder = String(+r.toPrecision(4));
  // 베트남 동 암산 팁
  if(c==='VND'){ const per=r; const tip = per>=15&&per<=25 ? '암산: 동에서 <b>0 하나 빼고 반으로</b> 나누면 대략 원 (100,000동 → 약 '+fmt(100000/per,'KRW')+'원). 메뉴판의 <b>50k</b> = 50,000동' : '메뉴판의 <b>50k</b> = 50,000동';
    $('tip').innerHTML=tip; $('tip').hidden=false; } else $('tip').hidden=true;
  // 표
  $('tblLab').textContent='자주 쓰는 '+NAME[c]+' 금액';
  $('tbl').innerHTML=QUICK[c].map(v=>'<tr><td>'+fmt(v,c)+' '+NAME[c]+'</td><td>'+fmt(v/r,'KRW')+'원</td></tr>').join('');
}

/* 환율 받기: open.er-api.com → 실패하면 jsDelivr 통화 API */
async function fetchRates(manualClick){
  const btn=$('refresh'); btn.textContent='받는 중…';
  try{
    let rates=null, src='';
    try{
      const r=await fetch('https://open.er-api.com/v6/latest/KRW',{cache:'no-store'}); const j=await r.json();
      if(j && j.rates && j.rates.VND){ rates=j.rates; src='open.er-api'; }
    }catch(e){}
    if(!rates){
      const r=await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/krw.json',{cache:'no-store'}); const j=await r.json();
      if(j && j.krw){ rates={}; for(const k in FALLBACK) rates[k]=j.krw[k.toLowerCase()]; src='currency-api'; }
    }
    if(!rates) throw new Error('no rates');
    st.rates={}; for(const k in FALLBACK) if(rates[k]>0) st.rates[k]=rates[k];
    st.at=Date.now(); st.src=src; save(); btn.textContent='↻ 환율 새로 받기';
  }catch(e){ btn.textContent= manualClick ? '못 받았어요 (인터넷 확인)' : '↻ 환율 새로 받기'; setTimeout(()=>btn.textContent='↻ 환율 새로 받기',2000); }
  render();
}

$('cur').onchange=()=>{ st.cur=$('cur').value; st.amt=''; save(); render(); };
$('swap').onclick=()=>{
  // 지금 결과를 입력으로 옮겨서 방향 바꾸기
  const f2k=st.dir==='f2k', a=num(st.amt), r=rate(), res=f2k?a/r:a*r;
  st.dir=f2k?'k2f':'f2k'; st.amt = a? String(Math.round(res*100)/100) : ''; fresh=true; save(); render();
};
$('keys').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const k=b.dataset.k||b.textContent;
  let s=st.amt;
  if(fresh && k!=='bs'){ s=''; } fresh=false;   // 빠른 금액·방향 바꾸기 뒤 숫자를 누르면 새로 입력
  if(k==='bs') s=s.slice(0,-1);
  else if(k==='000') s = s ? s+'000' : '';
  else s = (s==='0'?'':s)+k;
  if(s.replace(/\D/g,'').length>13) return;
  st.amt=s; save(); render();
});
// ⌫ 길게 누르면 전부 지우기
{ let t=null; const bs=$('keys').querySelector('[data-k="bs"]');
  bs.addEventListener('pointerdown',()=>{ t=setTimeout(()=>{ st.amt=''; save(); render(); t=null; },500); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>bs.addEventListener(ev,()=>{ if(t){ clearTimeout(t); t=null; } })); }
$('amt').addEventListener('input',()=>{ const v=$('amt').value.replace(/[^\d.]/g,''); st.amt=v; save(); render(); });
$('quick').addEventListener('click',e=>{ const b=e.target.closest('[data-q]'); if(!b) return; st.amt=b.dataset.q; fresh=true; save(); render(); });
$('refresh').onclick=()=>fetchRates(true);
$('manual').addEventListener('change',()=>{ const v=parseFloat($('manual').value); if(v>0) st.manual[st.cur]=v; else delete st.manual[st.cur]; save(); render(); });

render();
// 6시간 넘었으면 자동으로 새로 받기
if(navigator.onLine && Date.now()-st.at > 6*3600e3) fetchRates(false);
</script>
</body>
</html>
