<!doctype html><html lang="ko"><head><meta charset=utf8><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" type="image/png" href="../icons/favicon.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><meta name="theme-color" content="#1f3b33"><script src="../hub.js" defer></script><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>골프 뽑기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F1F5F0; --surface:#FFFFFF; --ink:#1F2D24; --muted:#5C6E62;
  --line:#D7E2D7; --green:#2E7D4F; --green-deep:#1E5A38; --green-soft:#E3EFE6;
  --flag:#D1493A; --flag-soft:#F9E4E0; --gold:#B8860B; --gold-soft:#F6EDD4;
  --ballW:#FDFDFB; --ballG:#2E7D4F; --dimple:#E4E8E2; --shadow:0 2px 10px rgba(31,45,36,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121B15; --surface:#1B2820; --ink:#E9F1EA; --muted:#95A89B;
    --line:#2C3B31; --green:#4CAF7A; --green-deep:#7BCB9E; --green-soft:#22382B;
    --flag:#E0604F; --flag-soft:#3C2521; --gold:#E0B84E; --gold-soft:#3A311B;
    --ballW:#F2F3EE; --ballG:#3E9367; --dimple:#D9DDD6; --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#121B15; --surface:#1B2820; --ink:#E9F1EA; --muted:#95A89B;
  --line:#2C3B31; --green:#4CAF7A; --green-deep:#7BCB9E; --green-soft:#22382B;
  --flag:#E0604F; --flag-soft:#3C2521; --gold:#E0B84E; --gold-soft:#3A311B;
  --ballW:#F2F3EE; --ballG:#3E9367; --dimple:#D9DDD6; --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); margin:0;
  font-family:"IBM Plex Sans KR",-apple-system,"Malgun Gothic",sans-serif; font-size:15px; line-height:1.5}
.wrap{max-width:520px; margin:0 auto; padding-inline:16px; padding-block:14px 40px}
header{display:flex; align-items:center; gap:10px; margin-bottom:12px}
h1{font-family:"Jua",sans-serif; font-weight:400; font-size:25px; margin:0; letter-spacing:.5px; white-space:nowrap}
.holechip,.multchip{white-space:nowrap}
header{flex-wrap:wrap; row-gap:6px}
.chips{margin-left:auto; display:flex; gap:8px}
.holechip{font-family:"Jua",sans-serif; font-size:17px; background:var(--green); color:#fff;
  border-radius:999px; padding:4px 12px; letter-spacing:.5px}
.multchip{font-family:"Jua",sans-serif; font-size:15px; background:var(--flag); color:#fff;
  border-radius:999px; padding:4px 12px; letter-spacing:1px; animation:blink 1.2s infinite alternate}
@keyframes blink{to{opacity:.65}}
@media (prefers-reduced-motion:reduce){.multchip{animation:none}}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
.label{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.08em; margin-bottom:8px}
.btn{border:0; border-radius:10px; padding:10px 14px; font:inherit; font-weight:700; cursor:pointer}
.btn:focus-visible{outline:2px solid var(--green-deep); outline-offset:2px}
.btn.ghost{background:var(--green-soft); color:var(--green-deep)}
.btn.main{background:var(--green); color:#fff; width:100%; padding:13px; font-size:17px; font-family:"Jua",sans-serif; font-weight:400; letter-spacing:1px}
.btn.main:active{transform:translateY(1px)}
.btn.warn{background:var(--flag-soft); color:var(--flag)}

.names{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.meta{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px}
.names input,.feein input,.meta input{width:100%; min-width:0; border:1px solid var(--line); background:var(--bg); color:var(--ink);
  border-radius:10px; padding:9px 12px; font:inherit}
.meta input[type=date]{padding:8px 8px}
.cwrap{position:relative; min-width:0}
.csug{position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:10px; box-shadow:var(--shadow); overflow:hidden}
.csug button{display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:none; color:var(--ink);
  font:inherit; font-weight:700; padding:11px 12px; cursor:pointer}
.csug button:last-child{border-bottom:0}
.csug button small{display:block; color:var(--muted); font-weight:500; font-size:12px}
.subc{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px}
.subc label{display:flex; flex-direction:column; gap:3px; font-size:12px; font-weight:700; color:var(--muted)}
.subc select{width:100%; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:10px; padding:9px 10px; font:inherit}
.subc .pars{display:grid; grid-template-columns:repeat(9,1fr); margin-top:2px; padding:0 2px;
  font-family:"Jua",sans-serif; font-size:18px; color:var(--ink); text-align:center; font-variant-numeric:tabular-nums}
.names input:focus,.feein input:focus,.meta input:focus{outline:2px solid var(--green); outline-offset:1px}
.roundinfo{margin:-6px 0 10px; font-size:13.5px; font-weight:700; color:var(--muted)}
.feein{display:flex; align-items:center; gap:8px; margin-top:12px}
.feein input{text-align:right; font-variant-numeric:tabular-nums; flex:1}
.feein .unit{color:var(--muted); font-weight:700}
.stepbtn{border:1px solid var(--line); background:var(--bg); color:var(--green-deep);
  border-radius:10px; width:42px; height:40px; font-size:17px; font-weight:700; cursor:pointer}
.hintline{font-size:12.5px; color:var(--muted); margin-top:10px}
.seg{display:flex; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px}
.seg button{flex:1; border:0; border-radius:8px; padding:8px 4px; font:inherit; font-weight:500; background:none; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:700; box-shadow:var(--shadow)}
.recgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:4px 0 12px}
.pbtn{padding:14px 6px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface);
  font:inherit; font-weight:700; font-size:16px; cursor:pointer; color:var(--ink)}
.pbtn.sel{background:var(--flag-soft); border-color:var(--flag); color:var(--flag)}
.pbtn:focus-visible{outline:2px solid var(--green-deep); outline-offset:2px}
.recbtns{display:grid; grid-template-columns:.8fr 1fr; gap:8px}
.recbtns .btn{padding:12px 4px; font-family:"Jua",sans-serif; font-weight:400; font-size:15.5px}
.recbtns .btn[disabled]{opacity:.45; cursor:default}

.turnline{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.turnline b{font-family:"Jua",sans-serif; font-weight:400; font-size:21px}
.turnline small{color:var(--muted)}
.bigwrap{display:flex; justify-content:center; margin:4px 0 12px}
.card.big{width:132px; aspect-ratio:3/4}
.card.big .ball{width:52px; height:52px}
.card.big .face.front .who{font-size:13px}
.card.big .face.front .lab{font-size:16px}
.card.big .face.back::after{width:44px; height:44px}
.drawnrow{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:4px}
.drawn{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11.5px; font-weight:700; color:var(--muted)}
.drawn .ball{width:26px; height:26px; font-size:12px}
.drawn.wait .ball{background:var(--bg); border-style:dashed}
.card{aspect-ratio:3/4.2; perspective:600px; cursor:pointer; border:0; background:none; padding:0}
.card:focus-visible .face.back{outline:2px solid var(--green-deep); outline-offset:2px}
.card .inner{display:block; position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.card[disabled]{cursor:default}
.face{position:absolute; inset:0; border-radius:11px; backface-visibility:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px}
.face.back{background:var(--surface);
  background-image:radial-gradient(var(--dimple) 1.5px, transparent 1.6px);
  background-size:10px 10px; background-position:center;
  border:1px solid var(--line); box-shadow:var(--shadow)}
.face.back::after{content:""; width:30px; height:30px; border-radius:50%; background:var(--green);
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34"><line x1="14" y1="9" x2="14" y2="25" stroke="white" stroke-width="2.2" stroke-linecap="round"/><path d="M14 9 L24 12 L14 15.2 Z" fill="white"/></svg>');
  background-size:contain}
.face.front{transform:rotateY(180deg); border:1px solid var(--line); box-shadow:var(--shadow);
  background:var(--surface); padding:4px}
.ball{width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line)}
.ball.W{background:var(--ballW);
  background-image:radial-gradient(rgba(0,0,0,.10) 1.2px, transparent 1.3px); background-size:7px 7px}
.ball.G{background:var(--ballG); border-color:transparent;
  background-image:radial-gradient(rgba(255,255,255,.22) 1.2px, transparent 1.3px); background-size:7px 7px}
.ball.J{background:var(--gold-soft); border-color:var(--gold); display:flex; align-items:center; justify-content:center;
  color:var(--gold); font-family:"Jua",sans-serif; font-size:15px}
.face.front .who{font-size:10.5px; color:var(--muted); font-weight:700; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.face.front .lab{font-family:"Jua",sans-serif; font-size:12.5px}
.face.front .lab.W{color:var(--muted)} .face.front .lab.G{color:var(--green-deep)} .face.front .lab.J{color:var(--gold)}

.teams{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px}
.team{border-radius:12px; padding:10px 12px; border:1px solid var(--line)}
.team h3{margin:0 0 4px; font-family:"Jua",sans-serif; font-weight:400; font-size:15px}
.team.W{background:var(--surface)} .team.W h3{color:var(--ink)}
.team.G{background:var(--green-soft)} .team.G h3{color:var(--green-deep)}
.team .mem{font-weight:700}
.team .jk{display:inline-block; background:var(--gold-soft); color:var(--gold); border-radius:6px;
  font-size:10.5px; font-weight:700; padding:0 5px; margin-left:4px; vertical-align:1px}
.resbtns{display:grid; grid-template-columns:1fr .8fr 1fr; gap:8px; margin-top:12px}
.resbtns .btn{padding:12px 4px; font-family:"Jua",sans-serif; font-weight:400; font-size:15.5px}
.resbtns .w{background:var(--surface); border:1.5px solid var(--line); color:var(--ink)}
.resbtns .t{background:var(--gold-soft); color:var(--gold)}
.resbtns .g{background:var(--green); color:#fff}
.scrows{margin-top:12px; display:flex; flex-direction:column; gap:6px}
.scrow{display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--line); border-radius:11px; background:var(--bg)}
.scrow.G{background:var(--green-soft)}
.scrow .nm{flex:1; min-width:0; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.scrow .val{width:58px; text-align:center; line-height:1.15}
.scrow .val b{display:block; font-family:"Jua",sans-serif; font-weight:400; font-size:19px; font-variant-numeric:tabular-nums}
.scrow .val small{display:block; font-size:10.5px; color:var(--muted); font-weight:700}
.scrow .stepbtn{background:var(--surface)}
.scsum{display:flex; justify-content:space-around; margin-top:10px; font-size:13.5px; color:var(--muted)}
.scsum b{font-family:"Jua",sans-serif; font-weight:400; font-size:17px; color:var(--ink); font-variant-numeric:tabular-nums}
.resbtn{width:100%; margin-top:10px}
.resbtn.T{background:var(--gold-soft); color:var(--gold)}
.tot .sc{font-size:11.5px; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums}
.stake{margin-top:10px; text-align:center; font-size:13px; color:var(--muted)}
.stake b{color:var(--flag); font-variant-numeric:tabular-nums}

.totals{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.tot{background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:8px 6px; text-align:center}
.tot .n{font-size:12px; font-weight:700; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tot .v{font-family:"Jua",sans-serif; font-size:16px; font-variant-numeric:tabular-nums}
.tot .v.pay{color:var(--flag)}
.potline{margin-top:10px; display:flex; justify-content:space-between; font-size:13.5px; color:var(--muted)}
.potline b{color:var(--ink); font-variant-numeric:tabular-nums}

.histwrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums}
th,td{padding:5px 8px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap}
th{color:var(--muted); font-size:11.5px; letter-spacing:.05em}
td.res-W{font-weight:700} td.res-G{color:var(--green-deep); font-weight:700} td.res-T{color:var(--gold); font-weight:700}
.toolrow{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px}
.toolrow .btn{font-size:13.5px; padding:9px 6px}
.btn.save{background:var(--green); color:#fff}
.arch{border:1px solid var(--line); border-radius:11px; margin-top:8px; background:var(--bg)}
.arch summary{list-style:none; cursor:pointer; padding:10px 12px; display:flex; flex-direction:column; gap:1px}
.arch summary::-webkit-details-marker{display:none}
.arch summary b{font-size:14.5px}
.arch summary small{color:var(--muted); font-size:12.5px}
.arch[open] summary{border-bottom:1px solid var(--line)}
.arch .body{padding:10px 12px}
.arch .del{margin-top:10px; width:100%; font-size:13px; padding:8px}
.finale{text-align:center; padding:6px 0 2px}
.finale h2{font-family:"Jua",sans-serif; font-weight:400; font-size:22px; margin:0 0 4px}
.finale p{margin:0; color:var(--muted); font-size:13.5px}
.empty{color:var(--muted); font-size:13.5px; text-align:center; padding:10px 6px}
</style>

<div class="wrap">
<header>
  <h1>골프 뽑기</h1>
  <span class="chips"><span class="multchip" id="multChip" hidden>배판 ×2</span>
  <span class="holechip" id="holeChip" hidden>HOLE 1</span></span>
</header>
<div class="roundinfo" id="roundInfo" hidden></div>

<!-- 설정 -->
<section class="panel" id="setupPanel">
  <div class="label">일자 · 골프장</div>
  <div class="meta">
    <input id="dateIn" type="date" aria-label="일자">
    <div class="cwrap">
      <input id="courseIn" maxlength="20" placeholder="골프장 선택" autocomplete="off" aria-label="골프장">
      <div class="csug" id="cSug" hidden></div>
    </div>
  </div>
  <div class="subc" id="subC" hidden>
    <label>전반 (1~9홀)<select id="frontSel"></select><span class="pars" id="parF"></span></label>
    <label>후반 (10~18홀)<select id="backSel"></select><span class="pars" id="parB"></span></label>
  </div>
  <div class="label" style="margin-top:14px">참가자 4명</div>
  <div class="names">
    <input id="n0" maxlength="8" placeholder="플레이어 1" autocomplete="off">
    <input id="n1" maxlength="8" placeholder="플레이어 2" autocomplete="off">
    <input id="n2" maxlength="8" placeholder="플레이어 3" autocomplete="off">
    <input id="n3" maxlength="8" placeholder="플레이어 4" autocomplete="off">
  </div>
  <div class="label" style="margin-top:14px">홀당 금액 (진 팀 1인당 적립)</div>
  <div class="feein">
    <button class="stepbtn" id="feeMinus" aria-label="금액 줄이기">−</button>
    <input id="feeIn" inputmode="numeric" value="5,000">
    <span class="unit">원</span>
    <button class="stepbtn" id="feePlus" aria-label="금액 늘리기">＋</button>
  </div>
  <div class="label" style="margin-top:14px">진행 방식</div>
  <div class="seg" id="dmSeg" role="group" aria-label="진행 방식">
    <button data-dm="app" aria-pressed="true">앱에서 뽑기</button>
    <button data-dm="rec" aria-pressed="false">결과만 기록</button>
  </div>
  <div class="hintline" id="dmHint">흰 2 · 녹 2 · 조커 1 중 한 장씩 뽑아 같은 색끼리 팀. 조커는 혼자 남은 색 편입니다. 동점 홀은 다음 홀이 배판(×2, 연속되면 ×4…)이 됩니다.</div>
  <div style="margin-top:12px"><button class="btn main" id="startBtn">라운드 시작</button></div>
</section>

<!-- 뽑기 -->
<section class="panel" id="drawPanel" hidden>
 <div id="appDraw">
  <div class="turnline"><b id="turnName"></b><small id="turnHint">카드를 눌러 뽑으세요</small></div>
  <div class="bigwrap" id="bigwrap"></div>
  <div class="drawnrow" id="drawnRow"></div>
 </div>
 <div id="recArea" hidden>
  <div class="turnline"><b>진 팀 기록</b><small>진 팀 두 명을 누르세요</small></div>
  <div class="recgrid" id="recGrid"></div>
  <div class="stake" id="recStake" style="margin:0 0 10px"></div>
  <div class="recbtns">
    <button class="btn t" id="recTie">동점</button>
    <button class="btn g" id="recSave" disabled>진 팀 확정</button>
  </div>
 </div>
  <div id="teamsArea" hidden>
    <div class="teams">
      <div class="team W"><h3>흰팀</h3><div class="mem" id="memW"></div></div>
      <div class="team G"><h3>녹팀</h3><div class="mem" id="memG"></div></div>
    </div>
    <div class="scrows" id="scRows"></div>
    <div class="scsum" id="scSum"></div>
    <button class="btn main resbtn" id="resBtn"></button>
    <div class="stake" id="stakeLine"></div>
  </div>
</section>

<!-- 라운드 종료 -->
<section class="panel" id="endPanel" hidden>
  <div class="finale">
    <h2>18홀 종료</h2>
    <p id="endLine"></p>
  </div>
</section>

<!-- 스코어보드 -->
<section class="panel" id="scorePanel" hidden>
  <div class="label">적립 현황</div>
  <div class="totals" id="totals"></div>
  <div class="potline"><span>총 적립금</span><b id="potSum">0원</b></div>
  <div class="histwrap" style="margin-top:10px">
    <table id="histTable" hidden>
      <thead><tr><th>홀</th><th>배</th><th>결과</th><th>1인당</th><th>낸 사람</th></tr></thead>
      <tbody id="histBody"></tbody>
    </table>
  </div>
  <div class="empty" id="histEmpty">아직 끝난 홀이 없습니다</div>
  <div class="toolrow">
    <button class="btn save" id="archBtn">기록 저장</button>
    <button class="btn ghost" id="switchBtn">방식 전환</button>
    <button class="btn ghost" id="undoBtn">이전 홀 취소</button>
    <button class="btn warn" id="resetBtn">새 라운드</button>
  </div>
  <div class="hintline">새 라운드를 누르면 지금 기록은 자동으로 저장됩니다</div>
</section>

<!-- 지난 기록 -->
<section class="panel" id="archPanel" hidden>
  <div class="label">지난 기록</div>
  <div id="archList"></div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('ko-KR');
let names=['',''  ,'',''], fee=5000, started=false, drawMode='app';
let history=[];            // app: {colors:[4], joker, result:'W'|'G'|'T'} / 기록: {result:'L', losers:[i,j]} 또는 {result:'T'}
let draw=null;             // {pool:[5], taken, colors:[4], busy}
let recSel=[];             // 기록 모드에서 선택된 진 팀
let resetArmed=false;
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
let date=todayStr(), course='', roundId=null, front='', back='';
/* 골프장별 코스 파 (1~9홀). 출처: 예약·야디지 사이트 스코어카드, 2026-10 */
const COURSES={
  '힐데스하임':{ '레이크':[4,3,5,4,3,5,4,4,4], '힐':[4,3,4,5,4,4,5,3,4], '밸리':[4,4,3,4,4,5,4,3,5] },
};
function courseKey(c){ const t=(c||'').replace(/\s/g,''); return Object.keys(COURSES).find(k=>t.includes(k))||null; }
function parAt(hole){
  const c=COURSES[courseKey(course)]; if(!c) return null;
  const arr=c[hole<=9?front:back]; return arr ? arr[(hole-1)%9] : null;
}
let rounds=[];             // 저장된 라운드: {id, date, course, names, fee, history, savedAt}

/* ---------- 저장/복원 ---------- */
function save(){ try{
  localStorage.setItem('gd2', JSON.stringify({names,fee,started,history,drawMode,date,course,roundId,front,back}));
}catch(e){} }
try{
  const s=JSON.parse(localStorage.getItem('gd2')||'null');
  if(s){ names=s.names||names; fee=s.fee||5000; started=!!s.started; history=Array.isArray(s.history)?s.history:[];
    if(s.drawMode==='rec') drawMode='rec';
    if(s.date) date=s.date; course=s.course||''; roundId=s.roundId||null; front=s.front||''; back=s.back||''; }
}catch(e){}
function saveRounds(){ try{ localStorage.setItem('gd2-rounds', JSON.stringify(rounds)); }catch(e){} }
try{ const r=JSON.parse(localStorage.getItem('gd2-rounds')||'[]'); if(Array.isArray(r)) rounds=r; }catch(e){}

/* ---------- 파생 값 ---------- */
function curHole(){ return history.length+1; }
function multAtH(hist,i){ let m=1; for(let k=0;k<i;k++) m = hist[k].result==='T' ? m*2 : 1; return m; }
function multAt(i){ return multAtH(history,i); }
function curMult(){ return multAt(history.length); }
function losersOf(h){
  if(h.result==='T') return [];
  if(h.result==='L') return h.losers||[];
  return teamOf(h, h.result==='W'?'G':'W');
}
function calcTotals(hist,fe){
  const t=[0,0,0,0];
  hist.forEach((h,i)=>{
    const m=multAtH(hist,i);
    losersOf(h).forEach(p=>t[p]+=fe*m);
  });
  return t;
}
function totals(){ return calcTotals(history,fee); }
const WD='일월화수목금토';
function fmtDate(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); if(!m) return '';
  return m[1]+'.'+m[2]+'.'+m[3]+' ('+WD[new Date(+m[1],m[2]-1,+m[3]).getDay()]+')';
}
function roundTitle(d,c){ return [fmtDate(d), c].filter(Boolean).join(' · '); }
function teamOf(h,color){
  const team=[];
  h.colors.forEach((c,p)=>{ if(c===color || (c==='J' && jokerSide(h)===color)) team.push(p); });
  return team;
}
function jokerSide(h){
  const w=h.colors.filter(c=>c==='W').length;
  return w<2 ? 'W' : 'G';
}

/* ---------- 설정 ---------- */
function loadSetupUI(){
  for(let i=0;i<4;i++) $('n'+i).value=names[i]||'';
  $('feeIn').value=fmt(fee);
  $('dateIn').value=date; $('courseIn').value=course;
  syncSubC();
}
/* 골프장 칸을 누르면 목록: 파 정보 있는 곳 + 지난 기록의 골프장 */
function courseOptions(){
  const seen=new Set(), out=[];
  Object.keys(COURSES).forEach(k=>{ seen.add(k); out.push({name:k, sub:Object.keys(COURSES[k]).join('·')}); });
  rounds.forEach(r=>{ const c=(r.course||'').trim(); if(c && !courseKey(c) && !seen.has(c)){ seen.add(c); out.push({name:c, sub:'지난 기록'}); } });
  return out;
}
function showSug(){
  const q=$('courseIn').value.replace(/\s/g,'');
  const list=courseOptions().filter(o=>!q || o.name.replace(/\s/g,'').includes(q) || q.includes(o.name.replace(/\s/g,'')));
  $('cSug').innerHTML=list.map(o=>'<button type="button" data-c="'+esc(o.name)+'">'+esc(o.name)+'<small>'+esc(o.sub)+'</small></button>').join('');
  $('cSug').hidden=!list.length;
}
$('courseIn').addEventListener('focus',showSug);
$('courseIn').addEventListener('click',showSug);
$('cSug').addEventListener('pointerdown',e=>e.preventDefault());   // 입력칸 포커스 유지
$('cSug').addEventListener('click',e=>{
  const b=e.target.closest('[data-c]'); if(!b) return;
  $('courseIn').value=b.dataset.c; course=b.dataset.c; syncSubC(); save();
  $('cSug').hidden=true; $('courseIn').blur();
});
$('courseIn').addEventListener('blur',()=>setTimeout(()=>{ $('cSug').hidden=true; },150));
function syncSubC(){
  const k=courseKey(course), c=COURSES[k];
  $('subC').hidden=!c; if(!c) return;
  const ks=Object.keys(c);
  if(!c[front]) front=ks[0];
  if(!c[back]) back=ks.find(x=>x!==front)||ks[0];
  [['frontSel',front],['backSel',back]].forEach(([id,v])=>{
    $(id).innerHTML=ks.map(x=>'<option'+(x===v?' selected':'')+'>'+x+'</option>').join('');
  });
  const cells=a=>a.map(n=>'<span>'+n+'</span>').join('');
  $('parF').innerHTML=cells(c[front]);
  $('parB').innerHTML=cells(c[back]);
}
$('dateIn').addEventListener('change',()=>{ date=$('dateIn').value||todayStr(); save(); });
$('courseIn').addEventListener('input',()=>{ course=$('courseIn').value.trim(); syncSubC(); save(); showSug(); });
$('frontSel').onchange=()=>{ front=$('frontSel').value; syncSubC(); save(); };
$('backSel').onchange=()=>{ back=$('backSel').value; syncSubC(); save(); };
$('feeIn').addEventListener('change',()=>{
  const v=parseInt($('feeIn').value.replace(/[^\d]/g,''),10);
  fee=isNaN(v)||v<100?5000:v; $('feeIn').value=fmt(fee); save(); render();
});
$('feeMinus').onclick=()=>{ fee=Math.max(500, fee-500); $('feeIn').value=fmt(fee); save(); render(); };
$('feePlus').onclick=()=>{ fee+=500; $('feeIn').value=fmt(fee); save(); render(); };
$('dmSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  drawMode=b.dataset.dm; save(); syncDmUI();
});
function syncDmUI(){
  [...$('dmSeg').children].forEach(x=>x.setAttribute('aria-pressed', x.dataset.dm===drawMode?'true':'false'));
  $('dmHint').textContent = drawMode==='app'
    ? '흰 2 · 녹 2 · 조커 1 중 한 장씩 뽑아 같은 색끼리 팀. 조커는 혼자 남은 색 편입니다. 홀이 끝나면 각자 파 대비 ±를 넣으면 팀 합산이 많은 쪽이 진 팀으로 기록됩니다. 동점 홀은 다음 홀이 배판(×2, 연속되면 ×4…)이 됩니다.'
    : '뽑기는 현장에서 직접 하고, 홀마다 진 팀 두 명만 기록하면 배판까지 자동 정산됩니다.';
}
$('startBtn').onclick=()=>{
  for(let i=0;i<4;i++){ const v=$('n'+i).value.trim(); names[i]=v||('P'+(i+1)); }
  date=$('dateIn').value||todayStr(); course=$('courseIn').value.trim();
  roundId=Date.now(); started=true; save(); render();
};

/* ---------- 뽑기 ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const LABT={W:'흰',G:'녹',J:'조커'};
function startDraw(){
  draw={ pool:shuffle(['W','W','G','G','J']), taken:0, colors:[null,null,null,null], busy:false };
  renderDraw();
}
function drawOrder(k){ return k; }  // 뽑는 순서 고정: 등록 순서대로

function ballHTML(c,extra){ return '<span class="ball '+c+(extra||'')+'">'+(c==='J'?'J':'')+'</span>'; }
function renderDraw(){
  $('teamsArea').hidden=true;
  renderBigCard();
  renderDrawnRow();
  updateTurnLine();
}
function renderBigCard(){
  const w=$('bigwrap'); w.innerHTML='';
  if(draw.taken>=4) return;
  const b=document.createElement('button'); b.className='card big';
  b.setAttribute('aria-label','뽑기 카드');
  b.innerHTML='<span class="inner"><span class="face back"></span>'+
    '<span class="face front"><span class="who"></span><span class="ballspot"></span><span class="lab"></span></span></span>';
  b.onclick=()=>pick(b);
  w.appendChild(b);
}
function renderDrawnRow(){
  $('drawnRow').innerHTML=[0,1,2,3].map(k=>{
    const p=drawOrder(k), c=draw.colors[p];
    if(c) return '<span class="drawn">'+ballHTML(c)+esc(names[p])+'</span>';
    return '<span class="drawn wait"><span class="ball"></span>'+esc(names[p])+'</span>';
  }).join('');
}
function esc(s){ return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function updateTurnLine(){
  if(draw.taken<4){
    $('turnName').textContent=names[drawOrder(draw.taken)]+' 차례';
    $('turnHint').hidden=false;
  }else{
    $('turnName').textContent='팀 확정!';
    $('turnHint').hidden=true;
  }
}
function pick(btn){
  if(!draw || draw.busy || draw.taken>=4) return;
  draw.busy=true;
  const p=drawOrder(draw.taken);
  const c=draw.pool[draw.taken];
  draw.colors[p]=c; draw.taken++;
  btn.querySelector('.who').textContent=names[p];
  btn.querySelector('.ballspot').outerHTML=ballHTML(c);
  const lab=btn.querySelector('.lab'); lab.textContent=LABT[c]; lab.classList.add(c);
  btn.classList.add('flipped'); btn.disabled=true;
  setTimeout(()=>{
    draw.busy=false;
    renderDrawnRow();
    if(draw.taken>=4){ $('bigwrap').innerHTML=''; updateTurnLine(); showTeams(); }
    else renderDraw();
  }, 1100);
}
function showTeams(){
  const h={colors:draw.colors};
  const W=teamOf(h,'W').map(p=>memHTML(p,h)), G=teamOf(h,'G').map(p=>memHTML(p,h));
  $('memW').innerHTML=W.join('<br>'); $('memG').innerHTML=G.join('<br>');
  const m=curMult();
  $('stakeLine').innerHTML='이번 홀: 진 팀 1인당 <b>'+fmt(fee*m)+'원</b> 적립'+(m>1?' (배판 ×'+m+')':'');
  draw.scores=[0,0,0,0];
  renderScoreInput();
  $('teamsArea').hidden=false;
}
/* 타수 입력: 파 대비 ± , 팀 합산이 적은 팀 승 */
const SCNAME={'-3':'알바트로스','-2':'이글','-1':'버디','0':'파','1':'보기','2':'더블','3':'트리플'};
const sgn=v=>v>0?'+'+v:v<0?'−'+(-v):'0';
function teamSum(h,color){ return teamOf(h,color).reduce((a,p)=>a+h.scores[p],0); }
function scoreResult(h){ const w=teamSum(h,'W'), g=teamSum(h,'G'); return w<g?'W':g<w?'G':'T'; }
function renderScoreInput(){
  const h={colors:draw.colors, scores:draw.scores};
  $('scRows').innerHTML=['W','G'].flatMap(c=>teamOf(h,c).map(p=>
    '<div class="scrow '+c+'">'+ballHTML(draw.colors[p])+'<span class="nm">'+esc(names[p])+'</span>'+
    '<button class="stepbtn" data-p="'+p+'" data-d="-1" aria-label="'+esc(names[p])+' 한 타 줄이기">−</button>'+
    '<span class="val"><b>'+sgn(draw.scores[p])+'</b><small>'+(SCNAME[draw.scores[p]]||'')+'</small></span>'+
    '<button class="stepbtn" data-p="'+p+'" data-d="1" aria-label="'+esc(names[p])+' 한 타 늘리기">＋</button></div>')).join('');
  const w=teamSum(h,'W'), g=teamSum(h,'G'), r=scoreResult(h);
  $('scSum').innerHTML='<span>흰팀 <b>'+sgn(w)+'</b></span><span>녹팀 <b>'+sgn(g)+'</b></span>';
  const b=$('resBtn');
  b.textContent='결과 확정 · '+(r==='T'?'동점':(r==='W'?'흰팀':'녹팀')+' 승');
  b.classList.toggle('T', r==='T');
}
$('scRows').addEventListener('click',e=>{
  const b=e.target.closest('[data-p]'); if(!b||!draw||!draw.scores) return;
  const p=+b.dataset.p; draw.scores[p]=Math.max(-3,Math.min(10,draw.scores[p]+(+b.dataset.d)));
  renderScoreInput();
});
function memHTML(p,h){
  const esc=s=>s.replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  return esc(names[p])+(h.colors[p]==='J'?'<span class="jk">JOKER</span>':'');
}
function finishHole(result){
  const jk=draw.colors.indexOf('J');
  history.push({colors:draw.colors, joker:jk>=0?jk:null, result, scores:[...draw.scores]});
  draw=null; save(); render();
}
$('resBtn').onclick=()=>{ if(draw&&draw.scores) finishHole(scoreResult({colors:draw.colors, scores:draw.scores})); };

/* ---------- 기록 모드 ---------- */
function renderRec(){
  $('recGrid').innerHTML='';
  names.forEach((n,i)=>{
    const b=document.createElement('button'); b.className='pbtn'+(recSel.includes(i)?' sel':'');
    b.textContent=n; b.setAttribute('aria-pressed', recSel.includes(i)?'true':'false');
    b.onclick=()=>{
      const k=recSel.indexOf(i);
      if(k>=0) recSel.splice(k,1);
      else{ if(recSel.length>=2) recSel.shift(); recSel.push(i); }
      renderRec();
    };
    $('recGrid').appendChild(b);
  });
  const m=curMult();
  $('recStake').innerHTML='이번 홀: 진 팀 1인당 <b>'+fmt(fee*m)+'원</b> 적립'+(m>1?' (배판 ×'+m+')':'');
  $('recSave').disabled = recSel.length!==2;
}
$('recSave').onclick=()=>{
  if(recSel.length!==2) return;
  history.push({result:'L', losers:[...recSel].sort()});
  recSel=[]; save(); render();
};
$('recTie').onclick=()=>{
  history.push({result:'T'});
  recSel=[]; save(); render();
};

/* ---------- 스코어보드 ---------- */
function scoreTotals(hist){
  if(!hist.some(h=>h.scores)) return null;
  const s=[0,0,0,0]; hist.forEach(h=>{ if(h.scores) h.scores.forEach((v,p)=>s[p]+=v); }); return s;
}
function totalsHTML(t,nm,hist){
  const sc=scoreTotals(hist||[]);
  return t.map((v,i)=>
    '<div class="tot"><div class="n">'+esc(nm[i])+'</div><div class="v'+(v>0?' pay':'')+'">'+fmt(v)+'</div>'+
    (sc?'<div class="sc">'+sgn(sc[i])+'</div>':'')+'</div>').join('');
}
function histRows(hist,fe,nm){
  return hist.map((h,i)=>{
    const m=multAtH(hist,i);
    let res,paid='—',who='—';
    if(h.result==='T'){ res='동점'; }
    else{
      res=h.result==='W'?'흰팀 승':h.result==='G'?'녹팀 승':'승부';
    }
    if(h.scores && h.colors){
      res+=' <small>('+sgn(teamSum(h,'W'))+':'+sgn(teamSum(h,'G'))+')</small>';
    }
    if(h.result!=='T'){
      paid=fmt(fe*m);
      who=losersOf(h).map(p=>esc(nm[p])).join('·');
    }
    return '<tr><td>'+(i+1)+'</td><td>'+(m>1?'×'+m:'')+'</td><td class="res-'+h.result+'">'+res+'</td><td>'+paid+'</td><td>'+who+'</td></tr>';
  }).join('');
}
function renderScore(){
  const t=totals();
  $('totals').innerHTML=totalsHTML(t,names,history);
  $('potSum').textContent=fmt(t.reduce((a,b)=>a+b,0))+'원';
  $('histBody').innerHTML=histRows(history,fee,names);
  $('histTable').hidden=!history.length;
  $('histEmpty').hidden=!!history.length;
}
$('undoBtn').onclick=()=>{
  if(!history.length) return;
  history.pop(); draw=null; recSel=[]; save(); render();
};

/* ---------- 라운드 기록 저장 ---------- */
// 같은 라운드는 다시 저장하면 덮어씀 (roundId 기준)
function archiveCurrent(){
  if(!history.length) return false;
  if(!roundId){ roundId=Date.now(); save(); }
  const ck=!!courseKey(course);
  const entry={id:roundId, date, course, front:ck?front:"", back:ck?back:"", names:[...names], fee, history:history.map(h=>({...h})), savedAt:Date.now()};
  const k=rounds.findIndex(r=>r.id===roundId);
  if(k>=0) rounds[k]=entry; else rounds.push(entry);
  rounds.sort((a,b)=>(b.date||'').localeCompare(a.date||'') || b.id-a.id);
  saveRounds(); renderArch();
  return true;
}
$('archBtn').onclick=()=>{
  const b=$('archBtn');
  b.textContent = archiveCurrent() ? '저장됨 ✓' : '끝난 홀이 없어요';
  setTimeout(()=>{ b.textContent='기록 저장'; },1500);
};
let delArmed=null;
function renderArch(){
  $('archPanel').hidden=!rounds.length;
  $('archList').innerHTML=rounds.map(r=>{
    const t=calcTotals(r.history,r.fee), pot=t.reduce((a,b)=>a+b,0);
    const title=esc((roundTitle(r.date,r.course)||'일자 없음')+(r.front?' · '+r.front+' → '+r.back:''));
    const sub=r.history.length+'홀 · 총 '+fmt(pot)+'원 · '+r.names.map(esc).join(', ');
    return '<details class="arch" data-id="'+r.id+'"><summary><b>'+title+'</b><small>'+sub+'</small></summary>'+
      '<div class="body"><div class="totals">'+totalsHTML(t,r.names,r.history)+'</div>'+
      '<div class="potline"><span>홀당 '+fmt(r.fee)+'원</span><b>총 '+fmt(pot)+'원</b></div>'+
      '<div class="histwrap" style="margin-top:8px"><table><thead><tr><th>홀</th><th>배</th><th>결과</th><th>1인당</th><th>낸 사람</th></tr></thead><tbody>'+
      histRows(r.history,r.fee,r.names)+'</tbody></table></div>'+
      '<button class="btn warn del" data-del="'+r.id+'">이 기록 삭제</button></div></details>';
  }).join('');
}
$('archList').addEventListener('click',e=>{
  const b=e.target.closest('[data-del]'); if(!b) return;
  const id=+b.dataset.del;
  if(delArmed!==id){ delArmed=id; b.textContent='한 번 더 누르면 삭제'; setTimeout(()=>{ if(delArmed===id){ delArmed=null; b.textContent='이 기록 삭제'; } },2500); return; }
  delArmed=null; rounds=rounds.filter(r=>r.id!==id); saveRounds(); renderArch();
});
$('switchBtn').onclick=()=>{
  drawMode = drawMode==='app' ? 'rec' : 'app';
  draw=null; recSel=[]; save(); syncDmUI(); render();
};
$('resetBtn').onclick=()=>{
  if(!resetArmed){ resetArmed=true; $('resetBtn').textContent='정말 초기화?'; setTimeout(()=>{resetArmed=false; $('resetBtn').textContent='새 라운드';},2500); return; }
  resetArmed=false; $('resetBtn').textContent='새 라운드';
  archiveCurrent();
  history=[]; started=false; draw=null; roundId=null; date=todayStr(); save(); loadSetupUI(); render();
};

/* ---------- 화면 전환 ---------- */
function render(){
  const done=started && history.length>=18;
  $('setupPanel').hidden=started;
  $('drawPanel').hidden=!started || done;
  $('endPanel').hidden=!done;
  $('scorePanel').hidden=!started;
  $('holeChip').hidden=!started || done;
  const hn=Math.min(curHole(),18), par=parAt(hn);
  $('holeChip').textContent='HOLE '+hn+(par?' · 파'+par:'');
  const m=curMult();
  $('multChip').hidden=!started || done || m<=1;
  $('multChip').textContent='배판 ×'+m;
  const info=roundTitle(date,course)+(courseKey(course)&&front?' · '+front+' → '+back:'');
  $('roundInfo').hidden=!started || !info;
  $('roundInfo').textContent=info;
  if(started && !done){
    const app = drawMode==='app';
    $('appDraw').hidden=!app;
    $('recArea').hidden=app;
    if(app){ if(!draw) startDraw(); }
    else{ $('teamsArea').hidden=true; renderRec(); }
  }
  if(done){
    const t=totals(); const mx=Math.max(...t);
    const worst=names.filter((_,i)=>t[i]===mx&&mx>0);
    $('endLine').textContent = mx>0 ? '오늘의 물주: '+worst.join(', ')+' ('+fmt(mx)+'원)' : '전홀 동점?! 다음에 다시 붙시죠';
  }
  if(started && !done) renderScore(); else if(done) renderScore();
}

loadSetupUI();
syncDmUI();
render();
renderArch();
</script>

</body></html>
