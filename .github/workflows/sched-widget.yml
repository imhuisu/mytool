# 일정 앱 자동 빌드 + 플레이스토어 내부 테스트 업로드 (PC 없이)
# - android/ 가 바뀌어 main 에 올라오면 실행. app/build.gradle.kts 의 versionCode 가
#   app/version.json 보다 클 때만 빌드한다 (버전 안 올린 수정은 빌드 안 함)
# - 결과: ① AAB 를 플레이스토어 내부 테스트에 올려 출시 (폰은 플레이스토어가 자동 업데이트)
#         ② app/sched-widget.apk, app/version.json 커밋 (사이트 다운로드용 + 앱의 "새 버전" 표시)
# - 필요한 저장소 Secrets (한 번만 설정, CLAUDE.md 참고)
#     MYTOOL_STORE_JKS_B64       : 서명(업로드) 키 파일 sched-release.jks 를 base64 로 바꾼 글자
#     MYTOOL_STORE_PASS          : 서명 키 비밀번호
#     PLAY_SERVICE_ACCOUNT_JSON  : 플레이 업로드용 구글 서비스 계정 키(JSON 파일 내용 전체). 없으면 업로드만 건너뜀
name: 일정 앱 빌드·플레이 업로드

on:
  push:
    branches: [main]
    paths: ['android/**']
  workflow_dispatch:
    inputs:
      force:
        description: '버전 그대로여도 빌드 (플레이 업로드는 같은 버전이면 거절됨)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sched-widget
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 버전 확인
        id: ver
        run: |
          code=$(grep -oP 'versionCode\s*=\s*\K\d+' android/app/build.gradle.kts)
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          cur=$(grep -oP '"versionCode":\s*\K\d+' app/version.json || echo 0)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt "$cur" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"; echo "빌드: v$name (code $code, 현재 $cur)"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"; echo "건너뜀: versionCode $code 가 현재 $cur 보다 크지 않음 (버전 올려야 빌드)"
          fi

      - name: 서명 키 확인
        if: steps.ver.outputs.go == '1'
        env:
          JKS: ${{ secrets.MYTOOL_STORE_JKS_B64 }}
          PASS: ${{ secrets.MYTOOL_STORE_PASS }}
        run: |
          if [ -z "$JKS" ] || [ -z "$PASS" ]; then
            echo "::error::저장소 Secrets 에 MYTOOL_STORE_JKS_B64 / MYTOOL_STORE_PASS 가 없어요 (CLAUDE.md 참고)"; exit 1
          fi
          echo "$JKS" | base64 -d > "$RUNNER_TEMP/sched-release.jks"

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.go == '1'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.ver.outputs.go == '1'
        with:
          gradle-version: '8.9'

      - name: APK·AAB 빌드
        if: steps.ver.outputs.go == '1'
        working-directory: android
        env:
          PASS: ${{ secrets.MYTOOL_STORE_PASS }}
        run: |
          gradle assembleRelease bundleRelease --console=plain \
            -PMYTOOL_STORE_FILE="$RUNNER_TEMP/sched-release.jks" -PMYTOOL_STORE_PASS="$PASS"
          rm -f "$RUNNER_TEMP/sched-release.jks"

      - name: 플레이 업로드 키 확인
        id: play
        if: steps.ver.outputs.go == '1'
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "has=0" >> "$GITHUB_OUTPUT"
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON 이 없어 플레이스토어 업로드는 건너뜀 (AAB 는 실행 결과 Artifacts 에서 받을 수 있음)"
          else
            echo "has=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 플레이스토어 내부 테스트로 출시
        if: steps.ver.outputs.go == '1' && steps.play.outputs.has == '1'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.imhuisu.mytool.sched
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.ver.outputs.code }} (${{ steps.ver.outputs.name }})
          track: internal
          status: completed

      - name: AAB 보관 (업로드 안 했을 때 직접 받기용)
        if: steps.ver.outputs.go == '1' && steps.play.outputs.has != '1'
        uses: actions/upload-artifact@v4
        with:
          name: sched-widget-${{ steps.ver.outputs.name }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: app/ 에 넣고 커밋
        if: steps.ver.outputs.go == '1'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk app/sched-widget.apk
          printf '{ "versionCode": %s, "versionName": "%s", "apk": "sched-widget.apk" }\n' \
            "${{ steps.ver.outputs.code }}" "${{ steps.ver.outputs.name }}" > app/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/sched-widget.apk app/version.json
          git commit -m "일정 앱 v${{ steps.ver.outputs.name }} 자동 빌드"
          git pull --rebase origin main
          git push origin HEAD:main
